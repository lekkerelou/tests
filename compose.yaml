services:
  admin:
    image: ${IMAGE:-ghcr.io/lekkerelou/tests:latest}
    build:
      context: .
    init: true
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "/app/healthcheck.mjs"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    stop_grace_period: 10s
